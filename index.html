<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ==========================================
         【网站基础设置】

    ========================================== -->

    <meta charset="UTF-8">

    <!-- 让网站适配手机 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 浏览器标签上显示的网站名字
         🔴 可迭代更新修改 -->
    <title>Ziling Zeng — Portfolio</title>

    <!-- 连接视觉样式 -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- ==========================================
         【首页】

         数字形象 MP4。

         🔴 可迭代更新修改：
         videos/avatar.mp4

    ========================================== -->

    <section class="hero">

        <!-- 数字形象动画 -->
        <video
            class="avatar-video"
            autoplay
            muted
            loop
            playsinline>

            <!-- 🔴 如果文件名字不同，
                 只修改这一行 -->

            <source
                src="videos/avatar.mp4"
                type="video/mp4">

        </video>


        <!-- ======================================
             【名字】

             🔴 可以修改
        ====================================== -->

        <div class="artist-name">
            ZILING ZENG
        </div>


        <!-- ======================================
             【向下滚动提示】

             🟡 可以修改文字
        ====================================== -->

        <div class="scroll-hint">
            ↓ SCROLL
        </div>

    </section>



    <!-- ==========================================
         【作品区域】

         目前先放一个示例作品。

         后面我们会把这里扩展成：
         Moving Image
         Projects
         Archive
         等分类。
    ========================================== -->

    <section class="works" id="works">

        <h1>WORKS</h1>


        <!-- ======================================
             【第一个分类】

             🔴 分类名称可以修改
        ====================================== -->

        <h2>PROJECTS</h2>


        <div class="works-grid">


            <!-- ==================================
                 【作品 01】

                 🔴 以后修改：
                 1. 图片
                 2. 标题
                 3. 年份
                 4. 链接

                 现在先使用示例。
            ================================== -->

            <a
                class="work-item"
                href="works/project01.html">

                <img
                    src="images/project01.jpg"
                    alt="Project 01">

                <div class="work-info">

                    <h3>Project 01</h3>

                    <p>2026</p>

                </div>

            </a>


            <!-- ==================================
                 【以后增加作品】

                 直接复制上面的
                 <a> ...... </a>

                 就可以增加第二个作品。
            ================================== -->


        </div>

    </section>



    <!-- ==========================================
         【ABOUT】

         以后这里可以放：
         - 个人介绍
         - CV
         - 联系方式

         现在先保留。
    ========================================== -->

    <section class="about">

        <h2>ABOUT</h2>

        <p>
            Ziling Zeng is an artist working with
            moving image, digital space and narrative.
        </p>

    </section>



    <!-- ==========================================
         【网站交互】

         暂时不要修改。
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
